# Shared git configuration, included from ~/.gitconfig.

[core]
  # Default identity. Org-level overrides below replace it per repository.
  sshCommand = "ssh -o IdentitiesOnly=yes -i ~/.ssh/identities/suhlig/id_ed25519"

[user]
  signingkey = ~/.ssh/identities/suhlig/id_ed25519.pub

[commit]
  gpgsign = true

[gpg]
  format = ssh

# https://calebhearth.com/sign-git-with-ssh
[gpg "ssh"]
  allowedsignersfile = ~/.ssh/git-signers

[url "git@github.com:"]
  insteadOf = https://github.com/

[url "git@gist.github.com:"]
  insteadOf = https://gist.github.com/

# https://dev-notes.eu/2022/06/Cargo-Add-for-Dependency-Management/
[url "https://github.com/rust-lang/crates.io-index"]
  insteadOf = https://github.com/rust-lang/crates.io-index

# Pairing with nerab. Matched by gitdir, with a trailing ** so it also covers
# wtg worktrees (<repo>/.git/worktrees/<name>). Not matched by remote URL: the
# dotfiles repo has a nerab/dotfiles upstream remote and would be captured.
[includeIf "gitdir:~/git/github.com/nerab/**"]
  path = ~/.gitconfig.d/orgs/nerab.conf

# Aishe. Matched by the repo's origin URL, so it also applies inside wtg
# worktrees, whose gitdir does not end in /.git.
[includeIf "hasconfig:remote.*.url:git@github.com:nowak-reisen/**"]
  path = ~/.gitconfig.d/orgs/nowak-reisen.conf

[includeIf "hasconfig:remote.*.url:git@github.com:speisehof/**"]
  path = ~/.gitconfig.d/orgs/nowak-reisen.conf
