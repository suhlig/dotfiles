[user]
  name = Nicholas E. Rabenau
  email = nerab@gmx.at

[core]
  # -F /dev/null stops ~/.ssh/config from adding the default key, which would
  # otherwise compete with -i and be offered first from the agent.
  sshCommand = "ssh -F /dev/null -o IdentitiesOnly=yes -o UseKeychain=yes -o AddKeysToAgent=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/identities/nerab/id_ed25519"
