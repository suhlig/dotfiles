Host *
  AddKeysToAgent yes
  UseKeychain yes
  StrictHostKeyChecking accept-new

# Identity is declared per host, never in `Host *`: a wildcard IdentityFile
# would compete with any per-command `-i`, and ssh picks between declared
# identities in agent order. Hosts without a block fall back to the default
# ~/.ssh/id_ed25519 and the agent.

Host pi raspi raspberrypi pi4 wordclock
  User pi
  IdentityFile ~/.ssh/identities/suhlig/id_ed25519
  IdentitiesOnly yes

Host ci *.speisehof.de speisehof.de nowak-reisen.de neon *.tailnet-204f.ts.net
  User root
  IdentityFile ~/.ssh/identities/suhlig/id_ed25519
  IdentitiesOnly yes

Host shop
  HostName shop.tailnet-204f.ts.net
  User suhlig
  IdentityFile ~/.ssh/identities/suhlig/id_ed25519
  IdentitiesOnly yes

# rpizero.local / wordclock-dev: the Mac -> Pi IPv6 TCP path stalls at the
# SSH banner. Prefer IPv4 until the AP/router IPv6 path is fixed.
Host rpizero.local wordclock-dev wordclock-dev.local
  User suhlig
  AddressFamily inet
  IdentityFile ~/.ssh/identities/suhlig/id_ed25519
  IdentitiesOnly yes
