Host *
  AddKeysToAgent yes
  UseKeychain yes
  IdentityFile ~/.ssh/identities/suhlig/id_ed25519
  IdentitiesOnly yes
  StrictHostKeyChecking accept-new

Host pi raspi raspberrypi pi4 wordclock
  User pi

Host ci *.speisehof.de speisehof.de nowak-reisen.de neon *.tailnet-204f.ts.net
  User root
  IdentityFile ~/.ssh/identities/suhlig/id_ed25519

Host shop
  HostName shop.tailnet-204f.ts.net
  User suhlig

# rpizero.local / wordclock-dev: the Mac -> Pi IPv6 TCP path stalls at the
# SSH banner. Prefer IPv4 until the AP/router IPv6 path is fixed.
Host rpizero.local wordclock-dev wordclock-dev.local
  User suhlig
  AddressFamily inet
